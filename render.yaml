services:
  - type: web
    name: tojey-backend
    runtime: node
    rootDir: .
    buildCommand: npm install && npm --prefix backend install
    startCommand: npm --prefix backend run start
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: MAX_FILE_SIZE
        value: 52428800
