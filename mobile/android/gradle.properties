# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true

# Force the Gradle daemon AND AGP compile JVM (JdkImageTransform/jlink) onto JDK 17.
# The system also has Java 21 installed; using it for jlink breaks the build.
org.gradle.java.home=/home/shujal/.sdkman/candidates/java/17.0.20-amzn
org.gradle.java.installations.paths=/home/shujal/.sdkman/candidates/java/17.0.20-amzn
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# React Native (RN 0.73)
newArchEnabled=false
hermesEnabled=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86
