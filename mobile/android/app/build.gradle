apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * Autolinking.
 *
 * Registers every RN native module under node_modules (document-picker, view-shot,
 * react-native-video, rn-fetch-blob, firebase, …) and generates the PackageList that
 * MainApplication loads. Without this call the built PackageList was stale and several
 * native modules were never registered, causing "native module is undefined" at runtime.
 */
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

/**
 * Firebase Cloud Messaging.
 *
 * google-services.json comes from the user's Firebase project and must NOT be committed
 * (it is not itself a secret, but it is project-specific). Apply the plugin only when the
 * file is present so the build still works without Firebase configured.
 */
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

/**
 * React Native Gradle Plugin (RN 0.73)
 */
react {
    jsRootDir = file("../../")
    reactNativeDir = rootProject.file("../node_modules/react-native/")
    codegenDir = rootProject.file("../node_modules/@react-native/codegen/")
    cliFile = file("../node_modules/react-native/cli.js")
    debuggableVariants = ["debug"]
    newArchEnabled = project.findProperty("newArchEnabled") == "true"
    hermesEnabled = project.findProperty("hermesEnabled")?.toBoolean() ?: true
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tojey"
    defaultConfig {
        applicationId "com.tojey"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation(project(":react-native-async-storage_async-storage"))
    implementation(project(":react-native-clipboard_clipboard"))
    implementation(project(":react-native-permissions"))
    implementation(project(":react-native-vector-icons"))
    implementation(project(":react-native-image-picker"))
    implementation(project(":rn-fetch-blob"))
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
